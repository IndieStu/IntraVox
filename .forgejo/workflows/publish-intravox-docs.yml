# Publiceert docs/ naar IntraVox zodra er iets aan de documentatie verandert.
#
# Roept `f/docs/intravox_publish` op Windmill aan; die cloont deze repo zélf en
# POST de ZIP naar de doelserver. Er staat dus geen kopie van de pipeline in dit
# repo, en de runner hoeft geen Python of docpipe te hebben.
#
# Async (`/jobs/run/p/...`, niet `run_wait_result`): publiceren duurt langer dan
# een CI-stap hoort te wachten. Windmill geeft meteen een job-id terug; de
# uitkomst staat in de Windmill-UI onder die id.
#
# LET OP: `app_slug` zit in de uniqueId-hash, samen met lang en root_page. Een
# verkeerde waarde geeft geen foutmelding maar een tweede, parallelle paginaboom
# met dode bookmarks. Voor deze repo is de slug `intravox`.
#
# Vereist secret WINDMILL_TOKEN (Windmill → User Settings → Tokens).
#
# WAAROM repo_url NOG NAAR GITHUB WIJST (en dat klopt):
# Forgejo draait met REQUIRE_SIGNIN_VIEW=true, dus een anonieme clone geeft 401.
# Windmill cloont zonder credentials en zou daarop stukloopen. GitHub is voor
# IntraVox de publieke spiegel en levert exact dezelfde docs/-boom.
# Wil je dit tóch naar Forgejo halen, dan moet er eerst een token-URL of een
# deploy-key in de Windmill-flow — niet alleen deze regel omzetten.

name: Publish docs to IntraVox

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/**'
      - 'screenshots/**'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Windmill publish job
        env:
          TOKEN: ${{ secrets.WINDMILL_TOKEN }}
        run: |
          job=$(curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
                  "repo_url": "https://github.com/nextcloud/IntraVox.git",
                  "app_slug": "intravox",
                  "target": "dev",
                  "dry_run": false
                }' \
            https://windmill.rikdekker.nl/api/w/admins/jobs/run/p/f/docs/intravox_publish)
          echo "Windmill job: $job"
          echo "Volg 'm op https://windmill.rikdekker.nl/run/$job"
